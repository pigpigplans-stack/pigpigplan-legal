<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PigPigPlan Privacy Policy and User Guide">
<link rel="icon" type="image/png" href="pig-icon.png">
<title>PigPigPlan — Privacy Policy &amp; User Guide</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b7280;--line:#e5e7eb;--brand:#0a84ff;--card:#f7f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0d;--fg:#e8e8ea;--muted:#9ca3af;--line:#2a2a2e;--card:#17171a;--brand:#3b9dff}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:14px 18px}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand .logo{height:30px;width:auto;display:block}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lang,.tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 10px;border-radius:999px;font-size:13px}
.lang.active,.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{padding:8px 16px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:0 18px 60px}
h2{font-size:22px;margin:1.2em 0 .4em}
h3{font-size:17px;margin:1.4em 0 .3em}
.meta{color:var(--muted);font-size:13px}
.callout{background:var(--card);border-left:4px solid var(--brand);padding:12px 14px;border-radius:8px;margin:14px 0}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card)}
ul{padding-left:20px}
li{margin:.3em 0}
a{color:var(--brand)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:18px;text-align:center}
@media print{header{position:static}.langs,.tabs{display:none}body{font-size:12pt}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><img class="logo" src="pig-icon.png" alt="🐷" onerror="this.replaceWith('🐷')"> PigPigPlan</div>
    <div class="langs" id="langs"></div>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="doc"></div>
</main>
<footer>
  © 2026 PigPigPlan · <span id="footContact">Contact: pigpigplans@gmail.com</span>
</footer>

I18N["en"].privacy=`<h2>PigPigPlan Privacy Policy</h2>
<p class="meta">Effective Date: September 2026 · Platforms: iOS / iPadOS / macOS · Version: v1.1</p>
<div class="callout"><strong>Core commitment.</strong> PigPigPlan is a privacy-first, local-first finance &amp; personal data app. All data you create (including health data) stays on your device and is never uploaded to any server; exports are always initiated by you.</div>
<h3>1. What Data We Handle</h3>
<p>All data is entered by you or read after your explicit authorization on your device:</p>
<table><tr><th>Category</th><th>Content</th><th>Source</th></tr>
<tr><td>Finance</td><td>Ledgers, transactions, tags, budgets, installment plans</td><td>Your input / Excel import</td></tr>
<tr><td>Health</td><td>Heart rate, HRV, resting heart rate, sleep, respiratory rate, blood oxygen, body temperature, steps, workouts, mood, menstrual cycle, sun exposure</td><td>Apple Health (HealthKit), authorized per item by you</td></tr>
<tr><td>Content</td><td>Simple Album photos (incl. references to System Photos)</td><td>Your import / capture / authorized System Photos access</td></tr>
<tr><td>Preferences</td><td>Language, theme, health refresh interval, etc.</td><td>Generated locally</td></tr></table>
<p>We do <strong>NOT</strong> collect: name, email, phone number, contacts, location, advertising identifiers (IDFA), or device identifiers used for tracking.</p>
<h3>2. Storage &amp; Processing</h3>
<ul>
<li><strong>100% local storage</strong>: data is encrypted in a local database (SQLCipher, AES-256).</li>
<li><strong>On-device AI</strong>: the built-in model runs entirely on your device; queries never leave it.</li>
<li><strong>No server, no cloud, no account</strong>: we operate no servers receiving your data; no sign-up required; no advertising, analytics, or third-party tracking SDKs.</li>
<li><strong>Purpose</strong>: data is used only for features you personally use — bookkeeping, health stress analysis, semantic search, photo management.</li>
</ul>
<h3>3. HealthKit Disclosure</h3>
<p>PigPigPlan reads health data via Apple HealthKit for <strong>stress analysis</strong> (based on HRV, resting heart rate, sleep, etc.) and health trend display.</p>
<ul>
<li><strong>Authorization</strong>: the system asks you to authorize each data type individually;</li>
<li><strong>Scope</strong>: health data is processed locally, only for the purposes above;</li>
<li><strong>Prohibited</strong>: we do <strong>not</strong> use it for advertising, sell it, or disclose it to any third party;</li>
<li><strong>Revocation</strong>: disable authorization in the Health app (&ldquo;Data Access &amp; Devices&rdquo;) or delete the app to stop all access immediately.</li>
</ul>
<h3>4. Export</h3>
<p>You fully control your data. <strong>Export is always initiated by you</strong>:</p>
<ul>
<li>Export <strong>your own data</strong> to Excel (.xlsx/.csv) or files on your device or iCloud Drive;</li>
<li>Exportable data: <strong>finance records, health analysis results, album photos</strong>;</li>
<li>Export is for your personal backup, migration, or analysis only and is <strong>never automatically sent to third parties</strong>;</li>
<li><strong>This app offers no third-party API access to your data.</strong></li>
</ul>
<h3>5. Data Security</h3>
<ul>
<li>Database encrypted locally with <strong>SQLCipher</strong> (AES-256);</li>
<li>Health data processed within Apple&rsquo;s system security containers;</li>
<li>Device lock and OS security protect your data.</li>
</ul>
<h3>6. Data Retention &amp; Deletion</h3>
<table><tr><th>Action</th><th>Result</th></tr>
<tr><td>Delete a record</td><td>Removed immediately from the local database</td></tr>
<tr><td>Delete a ledger / album</td><td>Its data is removed together</td></tr>
<tr><td>Delete the app</td><td>Local data is removed with it (export first to keep; iCloud backup copies must be cleared separately)</td></tr>
<tr><td>Disable Health authorization</td><td>The app stops reading that health type immediately</td></tr></table>
<h3>7. Children&rsquo;s Privacy</h3>
<p>This app is not directed to children under 13 and does not knowingly collect their personal information.</p>
<h3>8. Third-Party Services</h3>
<p>No third-party advertising, analytics, or tracking services are integrated. The only dependencies are Apple HealthKit / SwiftUI / MLX (Apple on-device frameworks) and local open-source libraries (SQLite, etc.), used solely for on-device processing.</p>
<h3>9. Policy Changes &amp; Contact</h3>
<p>If this policy changes, we will update this page and mark the effective date; changes never retroactively process historical data. For questions, contact us via the in-app &ldquo;About&rdquo; page or the App Store developer contact.</p>
<h3>10. Features That Require Internet</h3>
<p>Weather and route planning require internet. Only the minimum necessary information is sent — your coordinates to the weather provider (Open-Meteo) and the start/end points to Apple Maps — with no personally identifying information. All other features work fully offline.</p>
<h3>11. System Photos &amp; Photo Organizing</h3>
<p>When organizing System Photos, the app only reads photo reference identifiers and metadata (capture time, location, type) via PhotoKit; it does not copy or upload photos. On-device analysis labels (scenes, text) are stored only in the local encrypted database and can be cleared in-app anytime. The app does not use &ldquo;People &amp; Pets&rdquo; face grouping and performs no face recognition.</p>`;
I18N["en"].guide=`<h2>PigPigPlan User Guide</h2>
<p class="meta">Everything runs on your device — no account required. Each section shows <strong>Input → Output</strong> and worked <strong>Examples</strong>.</p>
<h3>1. First Launch</h3>
<p><strong>Input:</strong> nothing — just open the app.</p>
<ul><li>Open the app → a local encrypted database is created automatically (no registration).</li><li>You then see the cover page with the tabs: Finance, Health, Albums, plus Tools / Personal / Settings.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>First install on a new device → database initialized, cover page shown.</li><li>Re-open the app later → your previous data is already there.</li></ul>
<h3>2. Home &amp; Navigation</h3>
<p><strong>Input:</strong> tap a tab, the 👑 crown, or ⚙️.</p>
<ul><li>Tap a tab → that module opens.</li><li>Tap 👑 on the cover → the subscription (Pro) page opens.</li><li>Tap ⚙️ → Settings opens (language, theme, refresh interval, data).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Tap “Health” → the health dashboard with your metrics.</li><li>Tap ⚙️ → Settings → change language to English.</li></ul>
<h3>3. Finance</h3>
<p><strong>Input:</strong> amount, tag, date, note (type them or speak one sentence).</p>
<ul><li>Create a ledger and add a transaction → it appears in the list; totals and charts update instantly.</li><li>Voice entry → tap the mic and speak → a confirmation card appears → tap Confirm to save.</li><li>Set a budget (tag + period + amount) → that tag shows a “spent / budget” progress bar.</li><li>Ask in natural language → get filtered results (computed on-device).</li><li>Privacy mode → amounts are hidden as ****** by default; tap the 👁️ “show / hide numbers” button at the top to reveal the real amounts (tap again to hide).</li><li>Charts &amp; reports → expense-composition pie, category bar chart, income/expense trend line, category spending trend, category ranking and period-over-period comparison — all computed on-device.</li><li>Voice query → tap the mic and ask a question out loud (e.g. “how much did I spend on dining this month”) → the answer is computed on-device.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Say “Lunch 35” → a pending card “Expense 35 · Dining”.</li><li>Say “Budget Groceries 2000 monthly” → a monthly Groceries budget of 2000.</li><li>Type “how much did I spend on dining this month” → this month’s dining total.</li></ul>
<h3>4. Health</h3>
<p><strong>Input:</strong> authorize the health types you want, then open a metric; voice entry also works.</p>
<ul><li>Open the Health tab and authorize types → cards for heart rate, HRV, sleep, workouts, body temperature, blood oxygen, steps, mood, and more.</li><li>Open Stress → a stress readout computed from HRV / resting heart rate / sleep, on-device.</li><li>Tap the mic and say a value → a pending entry you can confirm.</li><li>Voice / natural-language query → ask “which days had the highest stress” → routed to the stress / sleep / workout data and computed on-device.</li><li>Trend charts → a multi-metric health trend (stress / HRV / resting heart rate / sleep) and an emotion trend chart; export the trend report to Excel.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Grant Heart Rate &amp; Sleep → today’s resting HR and last night’s sleep.</li><li>Say “Blood pressure 120 80” → a pending blood-pressure entry.</li><li>Say “Weight 68” → a pending body-weight entry.</li><li>Say “headache, and my shoulder hurts too” → creates two separate draft entries at once.</li><li>Say “ran 30 min yesterday, burned 280 calories” → logs exercise duration + calories, dated yesterday.</li></ul>
<h3>5. Simple Album</h3>
<p><strong>Input:</strong> grant photo access, then pick photos with a filter.</p>
<ul><li>Grant access → the System Photos grid is readable.</li><li>Filter by Time / Place / Type / Favorites / Screenshots / Panorama / Burst / Live → the grid narrows to matching photos.</li><li>Select photos → create an album, reorder, play a slideshow, or export the album as MP4.</li><li>Pick two photos → compare them side by side.</li><li>Only photo references and metadata are read — photos are never copied or uploaded.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Filter “Screenshots” → only screenshots are listed.</li><li>Select 20 photos → Export as MP4 → a slideshow video saved to your device.</li><li>Pick 2 photos → Compare → thumbnails shown side by side.</li></ul>
<h3>6. Weather &amp; Routes (Traffic)</h3>
<p><strong>Input:</strong> open Weather (uses your location); for a route, set start, end, and transport mode.</p>
<ul><li>Open Weather → current conditions and the forecast (data from Open-Meteo; your coordinates are sent when fetching).</li><li>Enter start and end + mode (car / walk / cycle) → the route and ETA, computed by Apple Maps.</li><li>Traffic forecast → predict a route’s hourly travel time across the day (00–23), with a suggested best departure time and hourly details; export the forecast to Excel.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Open Weather → today’s temperature and the 7-day forecast.</li><li>Set Home → Office, mode “driving” → distance, duration, and the route on the map.</li><li>Switch mode to “walking” → the ETA updates for walking.</li><li>Open Traffic forecast → the morning and evening peaks are the slowest; pick a later departure → the ETA drops.</li></ul>
<h3>7. Search</h3>
<p><strong>Input:</strong> a keyword or a question.</p>
<ul><li>Type a keyword → matching notes and photos are returned by meaning.</li><li>Ask a question → an on-device AI model parses it; results are computed locally.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Type “dinner last week” → matching finance entries.</li><li>Type “beach photos” → matching album photos.</li><li>Ask “how much on transport this month” → the transport total.</li></ul>
<h3>8. Subscription (Pro)</h3>
<p><strong>Input:</strong> tap a plan (monthly / yearly), “Restore Purchases”, or “Manage Subscription”.</p>
<ul><li>Tap a plan → the Apple purchase sheet appears → confirm → all features are unlocked.</li><li>Tap “Restore Purchases” → a previous purchase is recovered (requires internet).</li><li>Tap “Manage Subscription” → change or cancel in Apple’s page; charges are collected by Apple.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Tap “Yearly” → confirm in the Apple sheet → Pro unlocked.</li><li>Tap “Restore Purchases” → a prior subscription is restored.</li><li>Tap “Manage Subscription” → Apple’s subscriptions page opens.</li></ul>
<h3>9. Settings &amp; Language</h3>
<p><strong>Input:</strong> pick a language, theme, or a data action.</p>
<ul><li>Change language / theme / refresh interval → the UI updates immediately.</li><li>Clear data / manage permissions / export → the matching screen opens.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Set language to English → the whole app switches instantly.</li><li>Switch to dark theme → colors change right away.</li></ul>
<h3>10. Export &amp; Backup</h3>
<p><strong>Input:</strong> choose what to export (finance / health analysis / album).</p>
<ul><li>Export → a file (Excel / CSV) is produced and saved to your device or iCloud Drive.</li><li>Exports are always initiated by you; nothing is sent automatically.</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Export this month’s finance → an .xlsx file saved to Files.</li><li>Export an album → photos written out to the location you choose.</li></ul>
<h3>11. Permissions &amp; Privacy Controls</h3>
<p><strong>Input:</strong> toggle a permission in system Settings, or delete the app.</p>
<ul><li>Health → revoke anytime in the Health app → “Data Access &amp; Devices”.</li><li>Photos → revoke in Settings → Privacy &amp; Security → Photos.</li><li>Microphone / Speech Recognition → revoke in Settings → Privacy &amp; Security.</li><li>Delete the app → all local data is removed (export first to keep it).</li></ul>
<p><strong>Examples:</strong></p>
<ul><li>Revoke Photos in Settings → the album grid can no longer read new photos.</li><li>Delete the app → local database gone; the app is reset.</li></ul>`;

I18N["zh-Hans"]={
 ui:{privacy:"隐私政策",guide:"操作说明"},
 contact:"联系：pigpigplans@gmail.com",
 privacy:`<h2>PigPigPlan 隐私政策</h2>
<p class="meta">生效日期：2026 年 9 月 · 平台：iOS / iPadOS / macOS · 版本：v1.1</p>
<div class="callout"><strong>核心承诺。</strong>PigPigPlan 是一款本地优先的记账与个人数据管理应用。你在 App 中产生的所有数据（包括健康数据）只存储在你的设备本地，绝不上传任何服务器；导出数据完全由你自主决定。</div>
<h3>1. 我们处理的数据</h3>
<p>PigPigPlan 处理的全部数据均为你在设备上主动输入或授权读取的数据：</p>
<table><tr><th>类别</th><th>内容</th><th>来源</th></tr>
<tr><td>财务</td><td>账本、收支记录、标签、预算、分期计划</td><td>你主动录入 / Excel 导入</td></tr>
<tr><td>健康</td><td>心率、HRV、静息心率、睡眠、呼吸、血氧、体温、步数、运动记录、情绪、生理期、日晒</td><td>Apple Health（HealthKit），经你逐项授权</td></tr>
<tr><td>内容</td><td>简易相册照片（含系统相册照片引用）</td><td>你主动导入 / 拍摄 / 授权读取系统相册</td></tr>
<tr><td>偏好</td><td>语言、主题、健康刷新间隔等</td><td>本地产生</td></tr></table>
<p>我们<strong>不</strong>收集：姓名、邮箱、手机号、通讯录、位置、广告标识符（IDFA）等用于追踪的设备标识符。</p>
<h3>2. 存储与处理</h3>
<ul>
<li><strong>100% 本地存储：</strong>所有数据加密存储在设备本地数据库（SQLCipher，AES-256）。</li>
<li><strong>设备端 AI：</strong>内置 AI 模型（自然语言解析）完全在本地运行，查询内容不会离开设备。</li>
<li><strong>无服务器、无云端、无账号：</strong>我们没有接收你数据的服务器，无需注册账号，App 不含任何广告、统计或第三方分析 SDK。</li>
<li><strong>用途：</strong>数据仅用于你本人使用的功能——记账、健康压力分析、语义搜索、照片管理。</li>
</ul>
<h3>3. 健康数据（HealthKit）专项声明</h3>
<p>PigPigPlan 通过 Apple HealthKit 读取健康数据，用于<strong>压力分析</strong>（基于 HRV、静息心率、睡眠等）与健康趋势展示。</p>
<ul>
<li><strong>授权方式：</strong>读取前会弹出系统授权框，由你逐项选择允许的类型。</li>
<li><strong>使用范围：</strong>健康数据仅在设备本地用于上述分析与展示。</li>
<li><strong>禁止行为：</strong>我们不会将健康数据用于广告、出售或向任何第三方披露。</li>
<li><strong>撤销：</strong>在系统「健康」App 的「数据访问与设备」中关闭授权，或删除本 App，即停止一切访问。</li>
</ul>
<h3>4. 导出功能声明</h3>
<p>你拥有数据的完整控制权，<strong>导出完全由你主动发起</strong>。App 可将你自己的数据（财务账本、健康分析结果、相册照片）导出为 Excel（.xlsx/.csv）或文件，保存到你的设备或 iCloud Drive。导出仅用于你个人备份、迁移或分析，不会被自动发送给任何第三方。本 App 不提供任何第三方 API 访问你的数据。</p>
<h3>5. 数据安全</h3>
<ul><li>数据库使用 <strong>SQLCipher</strong>（AES-256）本地加密存储。</li><li>健康数据在 Apple 系统安全容器内处理。</li><li>设备锁定与系统安全机制保护你的数据。</li></ul>
<h3>6. 数据保留与删除</h3>
<table><tr><th>操作</th><th>结果</th></tr>
<tr><td>删除单条记录</td><td>立即从本地数据库删除</td></tr>
<tr><td>删除账本/相册</td><td>连带删除其下数据</td></tr>
<tr><td>删除 App</td><td>本地数据随之删除（如需保留请先导出；系统 iCloud 备份中的副本需单独清除）</td></tr>
<tr><td>关闭健康授权</td><td>App 立即停止读取该类型健康数据</td></tr></table>
<h3>7. 儿童隐私</h3>
<p>本 App 不面向 13 岁以下儿童，也不会主动收集儿童个人信息。</p>
<h3>8. 第三方服务</h3>
<p>本 App 不集成任何第三方广告、统计或分析服务。唯一依赖为 Apple HealthKit / SwiftUI / MLX（Apple 本机框架）与本地开源库（SQLite 等），仅用于本机处理。</p>
<h3>9. 政策变更与联系</h3>
<p>若本政策发生变更，我们会更新本页面并标注生效日期，且不追溯处理历史数据。如有疑问，可通过 App 内置「关于」页面或 App Store 开发者联系方式与我们联系。</p>
<h3>10. 需要联网的功能</h3>
<p>天气与路线规划需要联网。仅发送必要的最少信息——获取天气时向天气服务商（Open-Meteo）发送你的坐标，路线导航时向 Apple 地图发送起点/终点，不含任何个人身份信息。其余功能完全离线可用。</p>
<h3>11. 系统相册与照片整理</h3>
<p>整理系统相册时，App 仅通过系统 PhotoKit 读取照片的引用标识与元数据（拍摄时间、位置、类型），不复制、不上传照片。本机生成的分析标签（场景、文字等）只存储在设备本地的加密数据库中，可随时在 App 内清除。App 不使用系统「人物与宠物」等人脸分组数据，也不进行人脸识别。</p>`,
 guide:`<h2>PigPigPlan 操作说明</h2>
<p class="meta">全部在本机运行，无需注册账号。每节都提供「输入 → 输出」与多个可照做的示例。</p>
<h3>1. 首次启动</h3>
<p><strong>输入：</strong>无需任何输入，直接打开 App 即可。</p>
<ul><li>打开 App → 自动建立本机加密数据库（无需注册）。</li><li>随后进入封面页，显示页签：财务、健康、相册，以及 工具 / 个人 / 设置。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>在新设备上首次安装 → 数据库初始化完成，显示封面页。</li><li>稍后再次打开 → 先前的数据仍在。</li></ul>
<h3>2. 主页与导航</h3>
<p><strong>输入：</strong>点击页签、封面上的 👑（皇冠）或 ⚙️。</p>
<ul><li>点击页签 → 打开对应模块。</li><li>点击封面上的 👑 → 打开订阅（Pro）页。</li><li>点击 ⚙️ → 打开设置（语言、主题、刷新间隔、数据）。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>点「健康」→ 进入显示各项指标的健康面板。</li><li>点 ⚙️ → 设置 → 把语言改为「简体中文」。</li></ul>
<h3>3. 财务</h3>
<p><strong>输入：</strong>金额、标签、日期、备注（可手输，或说一句话）。</p>
<ul><li>新建账本并添加一笔收支 → 列表立即新增，合计与图表同步更新。</li><li>语音记账 → 点麦克风说一句 → 弹出「待确认卡」→ 点确认即入库。</li><li>设置预算（标签 + 周期 + 金额）→ 该标签显示「已用 / 预算」进度条。</li><li>用自然语言提问 → 返回筛选结果（全部本机计算）。</li><li>隐私模式 → 金额默认隐藏为 ******；点顶部 👁️「显示 / 隐藏数字」按钮即可显示真实金额（再点一次恢复隐藏）。</li><li>图表与报表 → 支出构成饼图、分类柱状图、收支趋势折线、分类支出趋势，以及分类排名与环比对比报表，全部本机计算。</li><li>语音查询 → 点麦克风说出问题（如「这个月餐饮花了多少」）→ 答案本机计算。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>说「午餐 35」→ 生成待确认卡「支出 35 · 餐饮」。</li><li>说「预算 超市 2000 每月」→ 设置超市每月预算 2000。</li><li>输入「这个月餐饮花了多少」→ 返回本月餐饮合计。</li></ul>
<h3>4. 健康</h3>
<p><strong>输入：</strong>按需授权要共享的健康类型，然后打开某项指标；也支持语音输入。</p>
<ul><li>进入健康页并逐项授权 → 出现心率、HRV、睡眠、运动、体温、血氧、步数、情绪等卡片。</li><li>打开「压力」→ 基于 HRV / 静息心率 / 睡眠在本机计算的压力读数。</li><li>点麦克风说一个数值 → 生成待确认项。</li><li>语音 / 自然语言查询 → 说「哪几天压力最大」→ 自动路由到压力 / 睡眠 / 运动数据，本机计算。</li><li>趋势图 → 综合健康趋势（压力 / HRV / 静息心率 / 睡眠）与情绪趋势图；可把趋势报表导出为 Excel。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>授权「心率」与「睡眠」→ 显示今日静息心率与昨晚睡眠。</li><li>说「血压 120 80」→ 生成一笔待确认的血压记录。</li><li>说「体重 68」→ 生成一笔待确认的体重记录。</li><li>说“头疼，肩膀也酸” → 一次生成两条待确认记录。</li><li>说“昨天跑步 30 分钟，消耗 280 卡” → 记录运动时长 + 卡路里，日期=昨天。</li></ul>
<h3>5. 简易相册</h3>
<p><strong>输入：</strong>授权相册访问，然后用筛选挑选照片。</p>
<ul><li>授权 → 可读取系统相册照片网格视图。</li><li>按 时间 / 地点 / 类型 / 收藏 / 截图 / 全景 / 连拍 / 实况 筛选 → 网格收窄到符合的照片。</li><li>选取照片 → 建相册、排序、幻灯片播放，或把相册导出为 MP4。</li><li>选两张照片 → 并排对比。</li><li>只读取照片引用与元数据，绝不复制或上传照片。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>筛选「截图」→ 只列出截图。</li><li>选取 20 张 → 导出为 MP4 → 生成一段保存在设备上的幻灯片视频。</li><li>选 2 张 → 对比 → 两张缩略图并排显示。</li></ul>
<h3>6. 天气与路线（交通）</h3>
<p><strong>输入：</strong>打开天气（使用你的定位）；规划路线时设置起点、终点与交通方式。</p>
<ul><li>打开天气 → 显示当前天气与预报（数据来自 Open-Meteo，取天气时会发送你的坐标）。</li><li>输入起点和终点 + 方式（驾车 / 步行 / 骑行）→ 由 Apple 地图计算路线与 ETA。</li><li>交通预测 → 预测某条路线当天 0–23 时的逐小时耗时，并给出「建议出发时段」与逐小时明细；可导出 Excel。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>打开天气 → 显示今日气温与 7 天预报。</li><li>设置 家 → 公司，方式「开车」→ 显示距离、时间与地图路线。</li><li>把方式改为「步行」→ ETA 更新为步行时间。</li><li>打开「交通预测」→ 早晚高峰耗时最长；把出发时间往后调 → ETA 下降。</li></ul>
<h3>7. 搜索</h3>
<p><strong>输入：</strong>一个关键词或一个问题。</p>
<ul><li>输入关键词 → 按语义返回符合的笔记与照片。</li><li>提问 → 由内置本机 AI 模型解析，结果在本机计算。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>输入「上周的晚餐」→ 返回符合的财务记录。</li><li>输入「海边照片」→ 返回符合的相册照片。</li><li>问「这个月交通花了多少」→ 返回本月交通合计。</li></ul>
<h3>8. 订阅（Pro）</h3>
<p><strong>输入：</strong>点某个方案（月付 / 年付）、「恢复购买」或「管理订阅」。</p>
<ul><li>点方案 → 弹出 Apple 购买框 → 确认 → 解锁全部功能。</li><li>点「恢复购买」→ 恢复先前的购买（需联网）。</li><li>点「管理订阅」→ 在 Apple 页面中变更或取消；费用由 Apple 收取。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>点「年付」→ 在 Apple 购买框确认 → Pro 已解锁。</li><li>点「恢复购买」→ 恢复先前的订阅。</li><li>点「管理订阅」→ 打开 Apple 的订阅管理页。</li></ul>
<h3>9. 设置与语言</h3>
<p><strong>输入：</strong>选择语言、主题，或某个数据操作。</p>
<ul><li>修改语言 / 主题 / 刷新间隔 → 界面立即更新。</li><li>清除数据 / 管理权限 / 导出 → 打开对应页面。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>语言设为「English」→ 整个 App 立即切换。</li><li>切换到深色主题 → 颜色立即变化。</li></ul>
<h3>10. 导出与备份</h3>
<p><strong>输入：</strong>选择要导出的内容（财务 / 健康分析 / 相册）。</p>
<ul><li>导出 → 生成文件（Excel / CSV）并保存到你的设备或 iCloud Drive。</li><li>导出始终由你发起，绝不会自动发送。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>导出本月财务 → 一个 .xlsx 文件保存到「文件」。</li><li>导出某个相册 → 照片写出到你选择的位置。</li></ul>
<h3>11. 权限与隐私控制</h3>
<p><strong>输入：</strong>在系统设置中关闭某项权限，或删除 App。</p>
<ul><li>健康 → 随时在「健康」App →「数据访问与设备」中撤销。</li><li>相册 → 在 设置 → 隐私与安全性 → 照片 中撤销。</li><li>麦克风 / 语音识别 → 在 设置 → 隐私与安全性 中撤销。</li><li>删除 App → 全部本机数据被移除（如需保留请先导出）。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>在设置中撤销「照片」→ 相册网格不再能读取新照片。</li><li>删除 App → 本机数据库消失；App 恢复初始状态。</li></ul>`

I18N["zh-Hant"].privacy=`<h2>PigPigPlan 隱私權政策</h2>
<p class="meta">生效日期：2026 年 9 月 · 平台：iOS / iPadOS / macOS · 版本：v1.1</p>
<div class="callout"><strong>核心承諾。</strong>PigPigPlan 是一款本地優先的記帳與個人資料管理 App。你在 App 中產生的所有資料（包含健康資料）只儲存在你的裝置本地，絕不上傳任何伺服器；匯出資料完全由你自主決定。</div>
<h3>1. 我們處理的資料</h3>
<p>所有資料均為你在裝置上主動輸入或授權讀取的資料：</p>
<table><tr><th>類別</th><th>內容</th><th>來源</th></tr>
<tr><td>財務</td><td>帳本、收支紀錄、標籤、預算、分期計畫</td><td>你主動輸入 / Excel 匯入</td></tr>
<tr><td>健康</td><td>心率、HRV、靜息心率、睡眠、呼吸、血氧、體溫、步數、運動紀錄、情緒、生理期、日曬</td><td>Apple Health（HealthKit），經你逐項授權</td></tr>
<tr><td>內容</td><td>簡易相簿照片（含系統相簿照片引用）</td><td>你主動匯入 / 拍攝 / 授權讀取系統相簿</td></tr>
<tr><td>偏好</td><td>語言、主題、健康更新間隔等</td><td>本機產生</td></tr></table>
<p>我們<strong>不</strong>收集：姓名、Email、電話、通訊錄、位置、廣告識別碼（IDFA）等。</p>
<h3>2. 儲存與處理</h3>
<ul>
<li><strong>100% 本機儲存</strong>：資料以 SQLCipher（AES-256）加密儲存在裝置本地資料庫。</li>
<li><strong>裝置端 AI</strong>：內建 AI 模型在你的裝置本地執行，查詢內容不會離開裝置。</li>

<li><strong>用途</strong>：資料僅用於你本人使用的功能——記帳、健康壓力分析、語意搜尋、相簿管理。</li>
</ul>
<h3>3. HealthKit 專項聲明</h3>
<p>PigPigPlan 經 Apple HealthKit 讀取健康資料，用於<strong>壓力分析</strong>（基於 HRV、靜息心率、睡眠等）與健康趨勢顯示。</p>
<ul>
<li><strong>授權方式</strong>：讀取前會彈出系統授權框，由你逐項選擇允許的類型；</li>
<li><strong>使用範圍</strong>：健康資料僅在裝置本地用於上述分析與展示；</li>
<li><strong>禁止行為</strong>：我們<strong>不</strong>會將健康資料用於廣告、出售或向任何第三方揭露；</li>
<li><strong>撤銷</strong>：在系統「健康」App 的「資料存取與裝置」中關閉授權，或刪除本 App，即停止一切存取。</li>
</ul>
<h3>4. 匯出功能聲明</h3>
<p>你擁有資料的完整控制權，<strong>匯出完全由你主動發起</strong>：</p>
<ul>
<li>可將你自己的資料匯出為 Excel（.xlsx/.csv）或檔案，儲存至你的裝置或 iCloud Drive；</li>
<li>可匯出的資料包含：財務帳本、健康分析結果、相簿照片；</li>
<li>匯出僅用於你個人備份、遷移或分析，<strong>不會</strong>被自動傳送給任何第三方；</li>
<li><strong>本 App 不提供任何第三方 API 存取你的資料</strong>。</li>
</ul>
<h3>5. 資料安全</h3>
<ul>
<li>資料庫以 <strong>SQLCipher</strong>（AES-256）本機加密儲存；</li>
<li>健康資料在 Apple 系統安全容器內處理；</li>
<li>裝置鎖定與系統安全機制保護你的資料。</li>
</ul>
<h3>6. 資料保留與刪除</h3>
<table><tr><th>操作</th><th>結果</th></tr>

<tr><td>刪除帳本/相簿</td><td>連帶刪除其下資料</td></tr>
<tr><td>刪除 App</td><td>本機資料隨之刪除（如需保留請先匯出；系統 iCloud 備份中的副本需另行清除）</td></tr>
<tr><td>關閉健康授權</td><td>App 立即停止讀取該類健康資料</td></tr></table>
<h3>7. 兒童隱私</h3>
<p>本 App 不面向 13 歲以下兒童，也不會主動收集兒童個人資訊。</p>
<h3>8. 第三方服務</h3>
<p>本 App 不整合任何第三方廣告、統計或分析服務。唯一依賴為 Apple HealthKit / SwiftUI / MLX（Apple 裝置端框架，完全在本機執行）與開源本機資料庫（SQLite 等）。</p>
<h3>9. 政策變更與聯絡</h3>
<p>政策變更會更新本頁並標註生效日期。如有疑問，可透過 App 內「關於」頁或 App Store 開發者聯絡方式聯繫。</p>
<h3>10. 需要連網的功能</h3>
<p>天氣與路線規劃需要連網。僅發送必要的最少資訊——取得天氣時向天氣服務商（Open-Meteo）發送你的座標，路線導航時向 Apple 地圖發送起點/終點，不含任何個人身分資訊。其餘功能完全離線可用。</p>
<h3>11. 系統相簿與照片整理</h3>
<p>整理系統相簿時，App 僅透過系統 PhotoKit 讀取照片的引用識別與中繼資料（拍攝時間、位置、類型），不複製、不上傳照片。本機產生的分析標籤（場景、文字等）只儲存在裝置本地的加密資料庫中，可隨時在 App 內清除。App 不使用系統「人物與寵物」等人臉分組資料，也不進行人臉辨識。</p>`;

<ul><li>進入健康頁並逐項授權 → 出現心率、HRV、睡眠、運動、體溫、血氧、步數、情緒等卡片。</li><li>開啟「壓力」→ 基於 HRV / 靜息心率 / 睡眠在本機計算的壓力讀數。</li><li>點麥克風說一個數值 → 生成待確認項目。</li><li>語音 / 自然語言查詢 → 說「哪幾天壓力最大」→ 自動路由到壓力 / 睡眠 / 運動資料，本機計算。</li><li>趨勢圖 → 綜合健康趨勢（壓力 / HRV / 靜息心率 / 睡眠）與情緒趨勢圖；可把趨勢報表匯出為 Excel。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>授權「心率」與「睡眠」→ 顯示今日靜息心率與昨晚睡眠。</li><li>說「血壓 120 80」→ 生成一筆待確認的血壓紀錄。</li><li>說「體重 68」→ 生成一筆待確認的體重紀錄。</li><li>說「頭痛，肩膀也酸」 → 一次產生兩筆待確認紀錄。</li><li>說「昨天跑步 30 分鐘，消耗 280 卡」 → 記錄運動時長 + 卡路里，日期=昨天。</li></ul>
<h3>5. 簡易相簿</h3>
<p><strong>輸入：</strong>授權相簿存取，然後用篩選挑選照片。</p>
<ul><li>授權 → 可讀取系統相簿照片格狀檢視。</li><li>依 時間 / 地點 / 類型 / 收藏 / 截圖 / 全景 / 連拍 / 實況 篩選 → 格狀檢視收窄到符合的照片。</li><li>選取照片 → 建立相簿、排序、幻燈片播放，或把相簿匯出為 MP4。</li><li>選兩張照片 → 並排對比。</li><li>只讀取照片參照與中繼資料，絕不複製或上傳照片。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>篩選「截圖」→ 只列出截圖。</li><li>選取 20 張 → 匯出為 MP4 → 生成一段儲存在裝置上的幻燈片影片。</li><li>選 2 張 → 對比 → 兩張縮圖並排顯示。</li></ul>
<h3>6. 天氣與路線（交通）</h3>
<p><strong>輸入：</strong>開啟天氣（使用你的定位）；規劃路線時設定起點、終點與交通方式。</p>
<ul><li>開啟天氣 → 顯示目前天氣與預報（資料來自 Open-Meteo，取天氣時會發送你的座標）。</li><li>輸入起點和終點 + 方式（駕車 / 步行 / 騎行）→ 由 Apple 地圖計算路線與 ETA。</li><li>交通預測 → 預測某條路線當天 0–23 時的逐小時耗時，並給出「建議出發時段」與逐小時明細；可匯出 Excel。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>開啟天氣 → 顯示今日氣溫與 7 天預報。</li><li>設定 家 → 公司，方式「開車」→ 顯示距離、時間與地圖路線。</li><li>把方式改為「步行」→ ETA 更新為步行時間。</li><li>開啟「交通預測」→ 早晚高峰耗時最長；把出發時間往後調 → ETA 下降。</li></ul>
<h3>7. 搜尋</h3>
<p><strong>輸入：</strong>一個關鍵字或一個問題。</p>
<ul><li>輸入關鍵字 → 依語意返回符合的筆記與照片。</li><li>提問 → 由內建本機 AI 模型解析，結果在本機計算。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>輸入「上週的晚餐」→ 返回符合的財務紀錄。</li><li>輸入「海邊照片」→ 返回符合的相簿照片。</li><li>問「這個月交通花了多少」→ 返回本月交通合計。</li></ul>
<h3>8. 訂閱（Pro）</h3>
<p><strong>輸入：</strong>點某個方案（月付 / 年付）、「恢復購買」或「管理訂閱」。</p>
<ul><li>點方案 → 彈出 Apple 購買框 → 確認 → 解鎖全部功能。</li><li>點「恢復購買」→ 恢復先前的購買（需連網）。</li><li>點「管理訂閱」→ 在 Apple 頁面中變更或取消；費用由 Apple 收取。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>點「年付」→ 在 Apple 購買框確認 → Pro 已解鎖。</li><li>點「恢復購買」→ 恢復先前的訂閱。</li><li>點「管理訂閱」→ 開啟 Apple 的訂閱管理頁。</li></ul>
<h3>9. 設定與語言</h3>
<p><strong>輸入：</strong>選擇語言、主題，或某個資料操作。</p>
<ul><li>修改語言 / 主題 / 更新間隔 → 介面立即更新。</li><li>清除資料 / 管理權限 / 匯出 → 開啟對應頁面。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>語言設為「English」→ 整個 App 立即切換。</li><li>切換到深色主題 → 顏色立即變化。</li></ul>
<h3>10. 匯出與備份</h3>
<p><strong>輸入：</strong>選擇要匯出的內容（財務 / 健康分析 / 相簿）。</p>
<ul><li>匯出 → 產生檔案（Excel / CSV）並儲存到你的裝置或 iCloud Drive。</li><li>匯出始終由你發起，絕不會自動傳送。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>匯出本月財務 → 一個 .xlsx 檔案儲存到「檔案」。</li><li>匯出某相簿 → 照片寫出到你選擇的位置。</li></ul>
<h3>11. 權限與隱私控制</h3>
<p><strong>輸入：</strong>在系統設定中關閉某項權限，或刪除 App。</p>
<ul><li>健康 → 隨時在「健康」App →「資料存取與裝置」中撤銷。</li><li>相簿 → 在 設定 → 隱私權與安全性 → 照片 中撤銷。</li><li>麥克風 / 語音辨識 → 在 設定 → 隱私權與安全性 中撤銷。</li><li>刪除 App → 全部本機資料被移除（如需保留請先匯出）。</li></ul>
<p><strong>示例：</strong></p>
<ul><li>在設定中撤銷「照片」→ 相簿格狀檢視不再能讀取新照片。</li><li>刪除 App → 本機資料庫消失；App 恢復初始狀態。</li></ul>`;

I18N["ja"].privacy=`<h2>PigPigPlan プライバシーポリシー</h2>
<p class="meta">発効日：2026年9月 · 対応：iOS / iPadOS / macOS · 版：v1.1</p>
<div class="callout"><strong>基本方針。</strong>PigPigPlan はローカル優先の家計簿・個人データ管理アプリです。アプリ内で作成されたすべてのデータ（健康データを含む）はお客様のデバイス内にのみ保存され、サーバーにアップロードされることはありません。エクスポートは常にユーザー自身が開始・管理します。</div>
<h3>1. 取り扱うデータ</h3>
<p>すべてのデータは、お客様がデバイス上で入力したもの、または明示的に許可したものです：</p>
<table><tr><th>カテゴリ</th><th>内容</th><th>取得元</th></tr>
<tr><td>財務</td><td>帳簿、収支記録、タグ、予算、分割払いプラン</td><td>入力 / Excel取込</td></tr>
<tr><td>健康</td><td>心拍数、HRV、安静時心拍数、睡眠、呼吸、血中酸素、体温、歩数、運動記録、気分、生理周期、日光曝露</td><td>Apple Health（HealthKit）、項目ごとに許可</td></tr>
<tr><td>コンテンツ</td><td>簡易アルバムの写真（システム写真への参照を含む）</td><td>取込 / 撮影 / システム写真へのアクセス許可</td></tr>
<tr><td>設定</td><td>言語、テーマ、健康更新間隔など</td><td>端末内で生成</td></tr></table>
<p><strong>収集しません</strong>：氏名、メール、電話、連絡先、位置情報、広告識別子（IDFA）など。</p>
<h3>2. 保存と処理</h3>
<ul>
<li><strong>100%端末内保存</strong>：データはSQLCipher（AES-256）で暗号化し端末内データベースに保存。</li>
<li><strong>端末内AI</strong>：内蔵AIモデルは端末内で完全に動作し、クエリ内容が端末外に出ることはありません。</li>
<li><strong>サーバーなし・アカウント不要・広告なし</strong>：データを受け取るサーバーは運営していません。登録不要。広告・統計・第三者トラッキングSDKは含みません。</li>
<li><strong>目的</strong>：家計簿・健康ストレス分析・意味検索・写真管理など、お客様自身の機能にのみ使用されます。</li>
</ul>
<h3>3. HealthKit に関する明示</h3>
<p>PigPigPlan は、<strong>ストレス分析</strong>（HRV・安静時心拍数・睡眠などに基づく）と健康トレンド表示のため、Apple HealthKit を通じて健康データを読み取ります。</p>
<ul>
<li><strong>許可方法</strong>：アクセス前に、システムがデータ種別ごとに許可を求めます；</li>
<li><strong>利用範囲</strong>：健康データは上記の目的のため端末内でのみ処理されます；</li>
<li><strong>禁止事項</strong>：広告利用・販売・第三者への開示は一切行いません；</li>
<li><strong>停止方法</strong>：ヘルスケアアプリの「データアクセス」で許可をオフにするか、本アプリを削除すると、アクセスは直ちに停止します。</li>
</ul>
<h3>4. エクスポート</h3>
<p>お客様がデータを完全に管理します。<strong>エクスポートは常にユーザーが開始します</strong>：</p>
<ul>
<li>ご自身のデータをExcel（.xlsx/.csv）やファイルとして、端末またはiCloud Driveにエクスポートできます；</li>
<li>エクスポート可能なデータ：家計簿記録、健康分析結果、アルバム写真；</li>
<li>エクスポートは個人のバックアップ・移行・分析のみに使用され、第三者へ自動送信されることはありません；</li>
<li>本アプリは第三者向けのAPIアクセスを提供しません。</li>
</ul>
<h3>5. データセキュリティ</h3>
<ul>
<li>データベースは<strong>SQLCipher</strong>（AES-256）で端末内暗号化；</li>
<li>健康データはAppleシステムのセキュアコンテナ内で処理；</li>
<li>端末ロックとOSのセキュリティがデータを保護します。</li>
</ul>
<h3>6. 保持と削除</h3>
<table><tr><th>操作</th><th>結果</th></tr>
<tr><td>記録を削除</td><td>ローカルDBから即時削除</td></tr>
<tr><td>帳簿・アルバムを削除</td><td>関連データも削除</td></tr>
<tr><td>アプリを削除</td><td>端末内データも削除（必要なら先にエクスポート；iCloudバックアップ内のコピーは別途削除）</td></tr>
<tr><td>健康許可をオフ</td><td>その種別の読み取りを即時停止</td></tr></table>
<h3>7. 子供のプライバシー</h3>
<p>本アプリは13歳未満の子供を対象としておらず、子供の個人情報を意図的に収集することはありません。</p>
<h3>8. 第三者サービス</h3>
<p>第三者による広告・統計・トラッキングサービスは一切統合していません。唯一の依存先は、Apple HealthKit / SwiftUI / MLX（端末内で完結するApple製フレームワーク）と、ローカルのオープンソースライブラリ（SQLiteなど）です。</p>
<h3>9. 変更とお問い合わせ</h3>
<p>変更時は本ページを更新し、発効日を明記します。ご質問は、アプリ内の「情報」ページまたはApp Storeの開発者連絡先からお問い合わせください。</p>
<h3>10. ネット接続が必要な機能</h3>
<p>天気と経路計画にはネット接続が必要です。必要最小限の情報のみを送信します——天気取得時は座標を天気サービス（Open-Meteo）へ、経路案内時は出発地/目的地をAppleマップへ送信し、個人を特定する情報は含みません。その他の機能は完全にオフラインで利用できます。</p>
<h3>11. システム写真と写真整理</h3>
<p>システム写真を整理する際、本アプリは PhotoKit を通じて写真の参照識別子とメタデータ（撮影日時・場所・種類）のみを読み取り、写真を複製・アップロードしません。端末内で生成された分析ラベル（シーン・文字など）は端末内の暗号化データベースにのみ保存され、アプリ内でいつでも削除できます。本アプリは「人とペット」などの顔グループデータを使用せず、顔認識も行いません。</p>`;
I18N["ja"].guide=`<h2>PigPigPlan 操作ガイド</h2>
<p class="meta">すべて端末内で動作し、アカウント登録は不要です。各セクションで「入力 → 出力」と、そのまま試せる例を複数示します。</p>
<h3>1. 初回起動</h3>
<p><strong>入力：</strong>入力は不要。アプリを開くだけです。</p>
<ul><li>アプリを開く → 端末内の暗号化データベースが自動で作成されます（登録不要）。</li><li>その後カバー画面が表示され、タブ：家計・健康・アルバム、および ツール / パーソナル / 設定 が出ます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>新しい端末で初めてインストール → データベースが初期化され、カバー画面が表示される。</li><li>後で再度開く → 以前のデータがそのまま残っている。</li></ul>
<h3>2. ホームとナビゲーション</h3>
<p><strong>入力：</strong>タブ、カバーの 👑（王冠）、または ⚙️ をタップします。</p>
<ul><li>タブをタップ → そのモジュールが開きます。</li><li>カバーの 👑 をタップ → サブスクリプション（Pro）画面が開きます。</li><li>⚙️ をタップ → 設定（言語・テーマ・更新間隔・データ）が開きます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「健康」をタップ → 各指標を表示する健康ダッシュボードへ。</li><li>⚙️ をタップ → 設定 → 言語を「日本語」に変更。</li></ul>
<h3>3. 家計</h3>
<p><strong>入力：</strong>金額・タグ・日付・メモ（手入力、または一言話す）。</p>
<ul><li>家計簿を作成して取引を追加 → リストに即時追加され、合計とグラフが同期更新されます。</li><li>音声入力 → マイクをタップして一言話す → 「確認カード」が出る → 確認をタップで保存。</li><li>予算を設定（タグ + 期間 + 金額）→ そのタグに「使用済み / 予算」の進捗バーが表示されます。</li><li>自然言語で質問 → 絞り込んだ結果を返します（すべて端末内で計算）。</li><li>プライバシーモード → 金額は既定で ****** と非表示。上部の 👁️「数字の表示 / 非表示」ボタンで実際の金額を表示（もう一度押すと非表示）。</li><li>グラフとレポート → 支出構成の円グラフ、カテゴリ別棒グラフ、収支トレンド折れ線、カテゴリ別支出トレンド、カテゴリ別ランキング、前期比レポート。すべて端末内で計算。</li><li>音声検索 → マイクをタップして質問を話す（例「今月の食費はいくら」）→ 答えは端末内で計算。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「昼食 35」と言う → 確認カード「支出 35 · 食事」。</li><li>「予算 スーパー 2000 毎月」と言う → スーパーの月予算 2000 を設定。</li><li>「今月の食費はいくら」と入力 → 今月の食費合計を返す。</li></ul>
<h3>4. 健康</h3>
<p><strong>入力：</strong>共有したい健康タイプを必要な分だけ許可し、指標を開きます。音声入力も使えます。</p>
<ul><li>健康タブで項目ごとに許可 → 心拍数・HRV・睡眠・ワークアウト・体温・血中酸素・歩数・気分などのカードが表示されます。</li><li>「ストレス」を開く → HRV / 安静時心拍数 / 睡眠から端末内で計算したストレス値。</li><li>マイクをタップして数値を言う → 確認待ちのエントリが生成されます。</li><li>音声 / 自然言語クエリ → 「どの日が一番ストレスが高い？」と尋ねる → ストレス / 睡眠 / ワークアウトのデータに振り分けて端末内で計算。</li><li>トレンドグラフ → 総合健康トレンド（ストレス / HRV / 安静時心拍数 / 睡眠）と気分トレンドグラフ。レポートは Excel に書き出せます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「心拍数」と「睡眠」を許可 → 今日の安静時心拍と昨夜の睡眠を表示。</li><li>「血圧 120 80」と言う → 確認待ちの血圧記録。</li><li>「体重 68」と言う → 確認待ちの体重記録。</li><li>「頭が痛い、肩も痛い」と言う → まとめて2件の確認カードを作成。</li><li>「昨日 30 分ランニング、280 カロリー消費」と言う → 運動時間とカロリーを記録（日付=昨日）。</li></ul>
<h3>5. 簡易アルバム</h3>
<p><strong>入力：</strong>写真アクセスを許可し、フィルタで写真を選びます。</p>
<ul><li>許可 → システム写真のグリッドを読み取れます。</li><li>時間 / 場所 / 種類 / お気に入り / スクリーンショット / パノラマ / 連写 / ライブ で絞り込み → 一致する写真にグリッドが絞られます。</li><li>写真を選択 → アルバム作成・並べ替え・スライドショー、またはアルバムを MP4 に書き出し。</li><li>2 枚選ぶ → 並べて比較。</li><li>写真の参照とメタデータのみを読み取り、複製もアップロードもしません。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「スクリーンショット」で絞り込み → スクリーンショットだけが一覧表示。</li><li>20 枚選択 → MP4 に書き出し → 端末に保存されたスライドショー動画。</li><li>2 枚選ぶ → 比較 → サムネイルが並んで表示。</li></ul>
<h3>6. 天気とルート（交通）</h3>
<p><strong>入力：</strong>天気を開く（位置情報を使用）。ルートは出発地・目的地・移動手段を設定します。</p>
<ul><li>天気を開く → 現在の天気と予報（データは Open-Meteo。取得時に座標を送信）。</li><li>出発地と目的地 + 手段（車 / 徒歩 / 自転車）を入力 → Apple マップがルートと ETA を計算。</li><li>交通予測 → あるルートの当日 0〜23 時の1時間ごとの所要時間を予測し、「おすすめの出発時間帯」と時間帯別の内訳を表示。Excel に書き出せます。</li></ul>

<h3>7. 検索</h3>
<p><strong>入力：</strong>キーワードまたは質問。</p>
<ul><li>キーワードを入力 → 意味でメモ・写真を横断して一致する結果を返します。</li><li>質問する → 内蔵の端末内 AI モデルが解析し、結果は端末内で計算されます。</li></ul>

<h3>8. サブスクリプション（Pro）</h3>
<p><strong>入力：</strong>プラン（月払い / 年払い）、「購入の復元」、「サブスクリプションを管理」をタップ。</p>
<ul><li>プランをタップ → Apple の購入シートが表示 → 確認 → 全機能が解放されます。</li><li>「購入の復元」をタップ → 以前の購入を復元（ネット接続が必要）。</li><li>「サブスクリプションを管理」をタップ → Apple のページで変更・解約。料金は Apple が徴収します。</li></ul>
<p><strong>例：</strong></p>
<ul><li>「年払い」をタップ → Apple シートで確認 → Pro が解放。</li><li>「購入の復元」をタップ → 以前のサブスクリプションが復元。</li><li>「サブスクリプションを管理」をタップ → Apple の購読管理ページが開く。</li></ul>
<h3>9. 設定と言語</h3>
<p><strong>入力：</strong>言語・テーマ、またはデータ操作を選択します。</p>
<ul><li>言語 / テーマ / 更新間隔を変更 → UI が即時更新されます。</li><li>データの消去 / 権限の管理 / 書き出し → 該当画面が開きます。</li></ul>
<p><strong>例：</strong></p>
<ul><li>言語を「English」に設定 → アプリ全体が即時に切り替わる。</li><li>ダークテーマに切り替え → 色がすぐ変わる。</li></ul>
<h3>10. 書き出しとバックアップ</h3>

<ul><li>書き出し → ファイル（Excel / CSV）を生成し、端末または iCloud Drive に保存します。</li><li>書き出しは常にユーザーが開始し、自動送信は一切ありません。</li></ul>
<p><strong>例：</strong></p>
<ul><li>今月の家計を書き出し → .xlsx ファイルが「ファイル」に保存される。</li><li>アルバムを書き出し → 選んだ場所に写真が書き出される。</li></ul>
<h3>11. 権限とプライバシー管理</h3>
<p><strong>入力：</strong>システム設定で権限をオフにする、またはアプリを削除します。</p>
<ul><li>健康 → いつでも「ヘルスケア」App →「データアクセスとデバイス」で取り消し。</li><li>写真 → 設定 → プライバシーとセキュリティ → 写真 で取り消し。</li><li>マイク / 音声認識 → 設定 → プライバシーとセキュリティ で取り消し。</li><li>アプリを削除 → すべての端末内データが削除されます（必要なら先に書き出し）。</li></ul>
<p><strong>例：</strong></p>
<ul><li>設定で「写真」を取り消し → アルバムのグリッドは新しい写真を読み取れなくなる。</li><li>アプリを削除 → 端末内データベースが消え、アプリは初期状態に戻る。</li></ul>`;

<p class="meta">시행일: 2026년 9월 · 플랫폼: iOS / iPadOS / macOS · 버전: v1.1</p>

<h3>10. 인터넷이 필요한 기능</h3>
<p>날씨와 경로 계획에는 인터넷이 필요합니다. 필요 최소한의 정보만 전송합니다 — 날씨 조회 시 좌표를 날씨 제공자(Open-Meteo)에, 경로 안내 시 출발지/도착지를 Apple 지도에 전송하며 개인 식별 정보는 포함하지 않습니다. 그 외 기능은 완전히 오프라인으로 사용할 수 있습니다.</p>

I18N["ko"].guide=`<h2>PigPigPlan 사용 안내</h2>
<p class="meta">전 과정이 기기에서 실행되며 계정 등록이 필요 없습니다. 각 항목은 「입력 → 출력」과 바로 따라 할 수 있는 예시를 제공합니다.</p>
<h3>1. 최초 실행</h3>
<p><strong>입력:</strong> 입력은 필요 없습니다. 앱을 열기만 하면 됩니다.</p>

<p><strong>예시:</strong></p>
<ul><li>새 기기에 처음 설치 → 데이터베이스가 초기화되고 커버 화면이 표시됩니다.</li><li>나중에 다시 열기 → 이전 데이터가 그대로 남아 있습니다.</li></ul>
<h3>2. 홈과 내비게이션</h3>
<p><strong>입력:</strong> 탭, 커버의 👑(왕관) 또는 ⚙️를 누릅니다.</p>
<ul><li>탭을 누름 → 해당 모듈이 열립니다.</li><li>커버의 👑를 누름 → 구독(Pro) 페이지가 열립니다.</li><li>⚙️를 누름 → 설정(언어, 테마, 갱신 간격, 데이터)이 열립니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「건강」을 누름 → 각 지표를 보여 주는 건강 대시보드로 이동.</li><li>⚙️를 누름 → 설정 → 언어를 「한국어」로 변경.</li></ul>
<h3>3. 가계부</h3>
<p><strong>입력:</strong> 금액, 태그, 날짜, 메모(직접 입력하거나 한 문장으로 말하기).</p>
<ul><li>장부를 만들어 거래를 추가 → 목록에 즉시 추가되고 합계와 차트가 함께 갱신됩니다.</li><li>음성 입력 → 마이크를 누르고 말하기 → 「확인 카드」가 나타남 → 확인을 누르면 저장됩니다.</li><li>예산 설정(태그 + 기간 + 금액) → 해당 태그에 「사용/예산」 진행 막대가 표시됩니다.</li><li>자연어로 질문 → 필터링된 결과를 반환합니다(전부 기기에서 계산).</li><li>개인정보 모드 → 금액은 기본적으로 ****** 로 가려집니다. 상단의 👁️「숫자 표시 / 숨기기」버튼을 누르면 실제 금액이 표시됩니다(다시 누르면 숨김).</li><li>차트 및 리포트 → 지출 구성 원형 차트, 분류 막대 차트, 수입/지출 추세 선, 분류별 지출 추세, 분류 순위, 전기 대비 리포트. 모두 기기에서 계산됩니다.</li><li>음성 질의 → 마이크를 누르고 질문을 말하기(예: "이번 달 식비는 얼마") → 답은 기기에서 계산.</li></ul>

<ul><li>「점심 35」라고 말하기 → 확인 카드 「지출 35 · 식비」.</li><li>「예산 마트 2000 매월」이라고 말하기 → 마트 월 예산 2000 설정.</li><li>「이번 달 식비는 얼마」라고 입력 → 이번 달 식비 합계 반환.</li></ul>
<h3>4. 건강</h3>
<p><strong>입력:</strong> 공유할 건강 유형을 필요한 만큼 허가한 뒤 지표를 엽니다. 음성 입력도 지원합니다.</p>
<ul><li>건강 탭에서 항목별로 허가 → 심박수, HRV, 수면, 운동, 체온, 혈중산소, 걸음 수, 기분 등의 카드가 표시됩니다.</li><li>「스트레스」 열기 → HRV / 안정 시 심박수 / 수면을 기반으로 기기에서 계산한 스트레스 값.</li><li>마이크를 누르고 수치를 말하기 → 확인 대기 항목이 생성됩니다.</li><li>음성 / 자연어 질의 → "언제 스트레스가 가장 높았어?"라고 묻기 → 스트레스 / 수면 / 운동 데이터로 라우팅되어 기기에서 계산.</li><li>추세 차트 → 종합 건강 추세(스트레스 / HRV / 안정 시 심박수 / 수면)와 기분 추세 차트. 리포트는 Excel로 내보낼 수 있습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「심박수」와 「수면」을 허가 → 오늘의 안정 시 심박수와 어젯밤 수면 표시.</li><li>「혈압 120 80」이라고 말하기 → 확인 대기 혈압 기록.</li><li>「체중 68」이라고 말하기 → 확인 대기 체중 기록.</li><li>“머리가 아프고 어깨도 아파요”라고 말하면 → 한 번에 두 개의 확인 카드 생성.</li><li>“어제 30분 달리기, 280칼로리 소모”라고 말하면 → 운동 시간 + 칼로리 기록(날짜=어제).</li></ul>
<h3>5. 간편 앨범</h3>
<p><strong>입력:</strong> 사진 접근을 허용한 뒤 필터로 사진을 고릅니다.</p>
<ul><li>허용 → 시스템 사진 그리드를 읽을 수 있습니다.</li><li>시간 / 장소 / 유형 / 즐겨찾기 / 스크린샷 / 파노라마 / 연사 / 라이브 로 필터링 → 그리드가 일치하는 사진으로 좁혀집니다.</li><li>사진 선택 → 앨범 만들기, 정렬, 슬라이드쇼 재생, 또는 앨범을 MP4로 내보내기.</li><li>사진 두 장 선택 → 나란히 비교.</li><li>사진 참조와 메타데이터만 읽고 사진을 복사하거나 업로드하지 않습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「스크린샷」으로 필터링 → 스크린샷만 목록에 표시.</li><li>20장 선택 → MP4로 내보내기 → 기기에 저장된 슬라이드쇼 영상.</li><li>2장 선택 → 비교 → 두 썸네일이 나란히 표시.</li></ul>
<h3>6. 날씨와 경로(교통)</h3>
<p><strong>입력:</strong> 날씨를 엽니다(위치 사용). 경로는 출발지, 도착지, 이동 수단을 설정합니다.</p>
<ul><li>날씨 열기 → 현재 날씨와 예보(데이터는 Open-Meteo, 조회 시 좌표 전송).</li><li>출발지와 도착지 + 수단(차 / 도보 / 자전거) 입력 → Apple 지도가 경로와 ETA를 계산.</li><li>교통 예측 → 특정 경로의 당일 0~23시 시간대별 소요 시간을 예측하고, 권장 출발 시간대와 시간대별 상세를 표시합니다. Excel로 내보낼 수 있습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>날씨 열기 → 오늘 기온과 7일 예보 표시.</li><li>집 → 회사, 수단 「차」 → 거리, 소요 시간과 지도 경로 표시.</li><li>수단을 「도보」로 변경 → ETA가 도보 시간으로 갱신.</li><li>「교통 예측」 열기 → 출퇴근 시간대가 가장 느림. 출발 시간을 늦추기 → ETA가 줄어듦.</li></ul>
<h3>7. 검색</h3>
<p><strong>입력:</strong> 키워드 하나 또는 질문 하나.</p>
<ul><li>키워드 입력 → 의미로 메모, 사진을 검색해 일치하는 결과를 반환합니다.</li><li>질문하기 → 내장 기기 내 AI 모델이 분석하고 결과는 기기에서 계산됩니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「지난주 저녁」 입력 → 일치하는 가계부 기록.</li><li>「바다 사진」 입력 → 일치하는 앨범 사진.</li><li>「이번 달 교통비는 얼마」 질문 → 이번 달 교통비 합계.</li></ul>
<h3>8. 구독(Pro)</h3>
<p><strong>입력:</strong> 플랜(월간 / 연간), 「구매 복원」, 「구독 관리」 중 선택해 누릅니다.</p>
<ul><li>플랜 누르기 → Apple 구매 시트가 표시 → 확인 → 모든 기능 해제.</li><li>「구매 복원」 누르기 → 이전 구매 복원(인터넷 필요).</li><li>「구독 관리」 누르기 → Apple 페이지에서 변경/해지; 요금은 Apple이 징수합니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>「연간」 누르기 → Apple 시트에서 확인 → Pro 해제.</li><li>「구매 복원」 누르기 → 이전 구독 복원.</li><li>「구독 관리」 누르기 → Apple 구독 관리 페이지 열림.</li></ul>
<h3>9. 설정과 언어</h3>
<p><strong>입력:</strong> 언어, 테마 또는 데이터 작업을 선택합니다.</p>
<ul><li>언어 / 테마 / 갱신 간격 변경 → UI가 즉시 갱신됩니다.</li><li>데이터 지우기 / 권한 관리 / 내보내기 → 해당 화면이 열립니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>언어를 「English」로 설정 → 앱 전체가 즉시 전환.</li><li>다크 테마로 전환 → 색상이 즉시 변경.</li></ul>
<h3>10. 내보내기와 백업</h3>
<p><strong>입력:</strong> 내보낼 내용을 선택합니다(가계부 / 건강 분석 / 앨범).</p>
<ul><li>내보내기 → 파일(Excel / CSV)을 생성해 기기 또는 iCloud Drive에 저장합니다.</li><li>내보내기는 항상 사용자가 시작하며 자동 전송은 없습니다.</li></ul>
<p><strong>예시:</strong></p>
<ul><li>이번 달 가계부 내보내기 → .xlsx 파일이 「파일」에 저장됨.</li><li>앨범 하나 내보내기 → 사진이 선택한 위치로 작성됨.</li></ul>
<h3>11. 권한과 개인정보 관리</h3>
<p><strong>입력:</strong> 시스템 설정에서 권한을 끄거나 앱을 삭제합니다.</p>
<ul><li>건강 → 언제든 건강 앱 → 「데이터 접근 및 기기」에서 철회.</li><li>사진 → 설정 → 개인정보 보호 및 보안 → 사진에서 철회.</li><li>마이크 / 음성 인식 → 설정 → 개인정보 보호 및 보안에서 철회.</li><li>앱 삭제 → 모든 기기 내 데이터가 삭제됩니다(필요하면 먼저 내보내기).</li></ul>
<p><strong>예시:</strong></p>
<ul><li>설정에서 「사진」을 철회 → 앨범 그리드가 새 사진을 읽을 수 없게 됨.</li><li>앱 삭제 → 기기 내 데이터베이스가 사라지고 앱이 초기 상태로 돌아감.</li></ul>`;

I18N["de"].privacy=`<h2>Datenschutzrichtlinie von PigPigPlan</h2>
<p class="meta">Gültig ab: September 2026 · Plattformen: iOS / iPadOS / macOS · Version: v1.1</p>
<div class="callout"><strong>Kernversprechen.</strong> PigPigPlan ist eine lokale, datenschutzorientierte App für Finanzen und persönliche Datenverwaltung. Alle in der App erstellten Daten (einschließlich Gesundheitsdaten) werden ausschließlich auf Ihrem Gerät gespeichert und niemals auf einen Server hochgeladen. Exporte lösen immer Sie selbst aus.</div>
<h3>1. Verarbeitete Daten</h3>
<p>Alle Daten werden von Ihnen eingegeben oder nach ausdrücklicher Autorisierung auf Ihrem Gerät gelesen:</p>
<table><tr><th>Kategorie</th><th>Inhalt</th><th>Quelle</th></tr>
<tr><td>Finanzen</td><td>Konten, Transaktionen, Tags, Budgets, Ratenpläne</td><td>Eingabe / Excel-Import</td></tr>
<tr><td>Gesundheit</td><td>Herzfrequenz, HRV, Ruheherzfrequenz, Schlaf, Atmung, Blutsauerstoff, Körpertemperatur, Schritte, Workouts, Stimmung, Menstruationszyklus, Sonnenexposition</td><td>Apple Health (HealthKit), Einzelautorisierung</td></tr>
<tr><td>Inhalte</td><td>Fotos des einfachen Albums (inkl. Verweise auf Systemfotos)</td><td>Import / Aufnahme / autorisierter Fotozugriff</td></tr>
<tr><td>Einstellungen</td><td>Sprache, Design, Aktualisierungsintervall usw.</td><td>Lokal erzeugt</td></tr></table>
<p>Wir erfassen NICHT: Name, E-Mail, Telefon, Kontakte, Standort, Werbekennung (IDFA) usw.</p>
<h3>2. Speicherung und Verarbeitung</h3>
<ul>
<li><strong>100 % lokale Speicherung</strong>: Daten werden verschlüsselt (SQLCipher, AES-256) in einer lokalen Datenbank gespeichert.</li>
<li><strong>On-Device-KI</strong>: Das integrierte KI-Modell läuft vollständig auf Ihrem Gerät; Ihre Anfragen verlassen das Gerät nie.</li>
<li><strong>Kein Server, kein Konto, keine Werbung</strong>: Wir betreiben keine Server, die Ihre Daten empfangen; keine Registrierung erforderlich; keine Werbe-, Analyse- oder Tracking-SDKs Dritter.</li>
<li><strong>Zweck</strong>: Daten dienen ausschließlich Ihren persönlichen Funktionen — Buchführung, Stressanalyse, semantische Suche, Fotoverwaltung.</li>
</ul>
<h3>3. HealthKit-Sondererklärung</h3>
<p>PigPigPlan liest Gesundheitsdaten über Apple HealthKit für die Stressanalyse (basierend auf HRV, Ruheherzfrequenz, Schlaf usw.) und Gesundheitstrends.</p>
<ul>
<li><strong>Autorisierung</strong>: Vor jedem Zugriff fragt das System Sie, jeden Datentyp einzeln zu erlauben;</li>
<li><strong>Umfang</strong>: Gesundheitsdaten werden lokal auf Ihrem Gerät verarbeitet, nur für die obigen Zwecke;</li>
<li><strong>Verbot</strong>: Wir verwenden sie nicht für Werbung, verkaufen sie nicht und geben sie nicht an Dritte weiter;</li>
<li><strong>Widerruf</strong>: Deaktivieren Sie die Autorisierung in der Health-App („Datenzugriff“) oder löschen Sie die App, um den Zugriff sofort zu beenden.</li>
</ul>
<h3>4. Export von Daten</h3>
<p>Sie behalten die volle Kontrolle über Ihre Daten. Exporte werden immer von Ihnen ausgelöst:</p>
<ul>
<li>Exportieren Sie Ihre eigenen Daten als Excel (.xlsx/.csv) oder Dateien auf Ihr Gerät oder iCloud Drive;</li>
<li>Exportierbare Daten: Finanzaufzeichnungen, Gesundheitsanalysen, Albumfotos;</li>
<li>Exporte dienen nur Ihrer persönlichen Sicherung, Migration oder Analyse und werden niemals automatisch an Dritte gesendet;</li>
<li>Diese App bietet keinen Dritt-API-Zugriff auf Ihre Daten.</li>
</ul>
<h3>5. Datensicherheit</h3>
<ul><li>Datenbank lokal mit SQLCipher (AES-256) verschlüsselt;</li><li>Gesundheitsdaten werden in den sicheren Containern des Apple-Systems verarbeitet;</li><li>Gerätesperre und Systemsicherheit schützen Ihre Daten.</li></ul>
<h3>6. Aufbewahrung und Löschung</h3>
<table><tr><th>Aktion</th><th>Ergebnis</th></tr>
<tr><td>Datensatz löschen</td><td>Sofortige Löschung aus der lokalen Datenbank</td></tr>
<tr><td>Konto / Album löschen</td><td>Zugehörige Daten werden mit gelöscht</td></tr>
<tr><td>App löschen</td><td>Lokale Daten werden gelöscht (erst exportieren; iCloud-Sicherungskopien separat löschen)</td></tr>
<tr><td>Gesundheitsautorisierung deaktivieren</td><td>Die App liest diesen Datentyp sofort nicht mehr</td></tr></table>
<h3>7. Datenschutz für Kinder</h3>
<p>Die App richtet sich nicht an Kinder unter 13 Jahren und erfasst deren personenbezogene Daten nicht wissentlich.</p>
<h3>8. Dienste Dritter</h3>
<p>Es sind keine Werbe-, Analyse- oder Tracking-Dienste Dritter integriert. Einzige Abhängigkeiten: Apple HealthKit / SwiftUI / MLX (Apple-Frameworks, vollständig auf dem Gerät) und lokale Open-Source-Bibliotheken (SQLite usw.).</p>
<h3>9. Änderungen und Kontakt</h3>
<p>Änderungen werden auf dieser Seite mit Gültigkeitsdatum veröffentlicht. Bei Fragen kontaktieren Sie uns über die Seite „Über“ in der App oder die Entwicklerkontaktdaten im App Store.</p>
<h3>10. Internet erforderlich für</h3>
<p>Wetter und Routenplanung benötigen Internet. Es werden nur die notwendigsten Informationen gesendet — bei Wetterabfragen Koordinaten an den Wetteranbieter (Open-Meteo), bei der Navigation Start/Ziel an Apple Maps; keine personenbezogenen Daten. Alle anderen Funktionen sind vollständig offline nutzbar.</p>
<h3>11. Systemfotos und Foto-Organisation</h3>
<p>Beim Organisieren deiner Systemfotos liest die App über PhotoKit nur Referenz-IDs und Metadaten (Aufnahmezeit, Ort, Typ); sie kopiert und lädt deine Fotos nicht hoch. Auf dem Gerät erzeugte Analyse-Labels (Szenen, Text) liegen nur in der lokalen verschlüsselten Datenbank und können in der App jederzeit gelöscht werden. Die App nutzt keine „Personen und Tiere“-Gruppierung und führt keine Gesichtserkennung durch.</p>`;
I18N["de"].guide=`<h2>PigPigPlan Anleitung</h2>
<p class="meta">Alles läuft auf Ihrem Gerät — kein Konto nötig. Jeder Abschnitt zeigt <strong>Eingabe → Ausgabe</strong> und konkrete <strong>Beispiele</strong>.</p>
<h3>1. Erster Start</h3>
<p><strong>Eingabe:</strong> nichts — App einfach öffnen.</p>
<ul><li>App öffnen → eine lokale verschlüsselte Datenbank wird automatisch angelegt (keine Registrierung).</li><li>Danach sehen Sie die Startseite mit den Tabs: Finanzen, Gesundheit, Alben sowie Werkzeuge / Persönlich / Einstellungen.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Erste Installation auf einem neuen Gerät → Datenbank initialisiert, Startseite erscheint.</li><li>App später erneut öffnen → Ihre bisherigen Daten sind bereits da.</li></ul>
<h3>2. Startseite &amp; Navigation</h3>
<p><strong>Eingabe:</strong> einen Tab, die Krone 👑 oder ⚙️ antippen.</p>
<ul><li>Tab antippen → das jeweilige Modul öffnet sich.</li><li>👑 auf der Startseite antippen → die Abo-Seite (Pro) öffnet sich.</li><li>⚙️ antippen → Einstellungen öffnen sich (Sprache, Design, Aktualisierungsintervall, Daten).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Gesundheit“ antippen → das Dashboard mit Ihren Werten.</li><li>⚙️ antippen → Einstellungen → Sprache auf Deutsch ändern.</li></ul>
<h3>3. Finanzen</h3>
<p><strong>Eingabe:</strong> Betrag, Tag, Datum, Notiz (eintippen oder einen Satz sprechen).</p>
<ul><li>Konto anlegen und eine Transaktion hinzufügen → sie erscheint in der Liste; Summen und Diagramme aktualisieren sich sofort.</li><li>Spracheingabe → Mikrofon antippen und sprechen → eine Bestätigungskarte erscheint → „Bestätigen“ zum Speichern.</li><li>Budget festlegen (Tag + Zeitraum + Betrag) → dieser Tag zeigt einen Fortschrittsbalken „ausgegeben / Budget“.</li><li>In natürlicher Sprache fragen → gefilterte Ergebnisse (on-device berechnet).</li><li>Datenschutzmodus → Beträge werden standardmäßig als ****** ausgeblendet; tippen Sie oben auf die 👁️-Schaltfläche „Zahlen anzeigen / ausblenden“, um die echten Beträge zu sehen (erneut tippen zum Ausblenden).</li><li>Diagramme &amp; Berichte → Ausgabenverteilung (Kreis), Kategorie-Balkendiagramm, Einnahmen/Ausgaben-Trend, Kategorie-Ausgabentrend, Kategorie-Ranking und Periodenvergleich — alles on-device berechnet.</li><li>Sprachabfrage → Mikrofon antippen und eine Frage sprechen (z. B. „wie viel habe ich diesen Monat für Essen ausgegeben“) → die Antwort wird on-device berechnet.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Mittagessen 35“ sagen → eine offene Karte „Ausgabe 35 · Essen“.</li><li>„Budget Supermarkt 2000 monatlich“ sagen → ein monatliches Supermarkt-Budget von 2000.</li><li>„wie viel habe ich diesen Monat für Essen ausgegeben“ eintippen → die Essen-Summe dieses Monats.</li></ul>
<h3>4. Gesundheit</h3>
<p><strong>Eingabe:</strong> die gewünschten Gesundheitstypen freigeben, dann einen Wert öffnen; Spracheingabe geht auch.</p>
<ul><li>Tab Gesundheit öffnen und Typen freigeben → Karten für Herzfrequenz, HRV, Schlaf, Workouts, Körpertemperatur, Blutsauerstoff, Schritte, Stimmung und mehr.</li><li>Stress öffnen → ein Stresswert aus HRV / Ruheherzfrequenz / Schlaf, on-device berechnet.</li><li>Mikrofon antippen und einen Wert sagen → ein offener Eintrag zum Bestätigen.</li><li>Sprach- / natürlichsprachliche Abfrage → fragen Sie „an welchen Tagen war der Stress am höchsten“ → wird auf Stress- / Schlaf- / Workout-Daten geroutet und on-device berechnet.</li><li>Trenddiagramme → Gesamtgesundheitstrend (Stress / HRV / Ruheherzfrequenz / Schlaf) und Stimmungstrend; den Bericht als Excel exportieren.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Herzfrequenz &amp; Schlaf freigeben → Ruhepuls von heute und Schlaf der letzten Nacht.</li><li>„Blutdruck 120 80“ sagen → ein offener Blutdruck-Eintrag.</li><li>„Gewicht 68“ sagen → ein offener Körpergewicht-Eintrag.</li><li>„Kopfschmerzen und die Schulter tut auch weh“ sagen → erzeugt zwei Entwürfe auf einmal.</li><li>„Gestern 30 Min gelaufen, 280 kcal verbrannt“ sagen → Dauer + Kalorien erfassen (Datum = gestern).</li></ul>
<h3>5. Einfaches Album</h3>
<p><strong>Eingabe:</strong> Fotozugriff freigeben, dann Fotos mit einem Filter auswählen.</p>
<ul><li>Zugriff freigeben → das Systemfotos-Raster ist lesbar.</li><li>Nach Zeit / Ort / Typ / Favoriten / Screenshots / Panorama / Serienbild / Live filtern → das Raster zeigt nur passende Fotos.</li><li>Fotos auswählen → Album erstellen, sortieren, Diashow abspielen oder Album als MP4 exportieren.</li><li>Zwei Fotos auswählen → nebeneinander vergleichen.</li><li>Es werden nur Foto-Referenzen und Metadaten gelesen — Fotos werden nie kopiert oder hochgeladen.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Filter „Screenshots“ → nur Screenshots werden gelistet.</li><li>20 Fotos auswählen → „Als MP4 exportieren“ → ein Diashow-Video auf Ihrem Gerät.</li><li>2 Fotos auswählen → „Vergleichen“ → Miniaturansichten nebeneinander.</li></ul>
<h3>6. Wetter &amp; Route (Verkehr)</h3>
<p><strong>Eingabe:</strong> Wetter öffnen (nutzt Ihren Standort); für eine Route Start, Ziel und Verkehrsmittel festlegen.</p>
<ul><li>Wetter öffnen → aktuelle Bedingungen und Vorhersage (Daten von Open-Meteo; beim Abruf werden Ihre Koordinaten gesendet).</li><li>Start und Ziel + Modus (Auto / Fuß / Fahrrad) eingeben → Route und ETA, berechnet von Apple Maps.</li><li>Verkehrsprognose → prognostiziert die stündliche Fahrzeit einer Route über den Tag (00–23) mit empfohlenem Abfahrtszeitfenster und Stunden-Details; als Excel exportierbar.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Wetter öffnen → heutige Temperatur und 7-Tage-Vorhersage.</li><li>Zuhause → Büro, Modus „Auto“ → Distanz, Dauer und Route auf der Karte.</li><li>Modus auf „Fuß“ umstellen → die ETA wird für Fußweg aktualisiert.</li><li>„Verkehrsprognose“ öffnen → die Stoßzeiten morgens/abends sind am langsamsten; später losfahren → die ETA sinkt.</li></ul>
<h3>7. Suche</h3>
<p><strong>Eingabe:</strong> ein Stichwort oder eine Frage.</p>
<ul><li>Stichwort eintippen → passende Notizen und Fotos werden nach Bedeutung gefunden.</li><li>Eine Frage stellen → ein On-Device-KI-Modell wertet sie aus; Ergebnisse werden lokal berechnet.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Abendessen letzte Woche“ eintippen → passende Finanz-Einträge.</li><li>„Strandfotos“ eintippen → passende Album-Fotos.</li><li>„wie viel für Verkehr diesen Monat“ fragen → die Verkehrs-Summe.</li></ul>
<h3>8. Abo (Pro)</h3>
<p><strong>Eingabe:</strong> einen Tarif antippen (monatlich / jährlich), „Kauf wiederherstellen“ oder „Abo verwalten“.</p>
<ul><li>Tarif antippen → das Apple-Kaufblatt erscheint → bestätigen → alle Funktionen werden freigeschaltet.</li><li>„Kauf wiederherstellen“ antippen → ein früherer Kauf wird wiederhergestellt (Internet nötig).</li><li>„Abo verwalten“ antippen → auf Apples Seite ändern oder kündigen; die Abrechnung erfolgt durch Apple.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>„Jährlich“ antippen → im Apple-Blatt bestätigen → Pro freigeschaltet.</li><li>„Kauf wiederherstellen“ antippen → ein früheres Abo wird wiederhergestellt.</li><li>„Abo verwalten“ antippen → Apples Abo-Seite öffnet sich.</li></ul>
<h3>9. Einstellungen &amp; Sprache</h3>
<p><strong>Eingabe:</strong> eine Sprache, ein Design oder eine Datenaktion wählen.</p>
<ul><li>Sprache / Design / Aktualisierungsintervall ändern → die Oberfläche aktualisiert sich sofort.</li><li>Daten löschen / Berechtigungen verwalten / exportieren → der passende Bildschirm öffnet sich.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Sprache auf Englisch stellen → die ganze App wechselt sofort.</li><li>Auf dunkles Design wechseln → die Farben ändern sich sofort.</li></ul>
<h3>10. Export &amp; Backup</h3>
<p><strong>Eingabe:</strong> wählen, was exportiert wird (Finanzen / Gesundheitsanalyse / Album).</p>
<ul><li>Exportieren → eine Datei (Excel / CSV) wird erzeugt und auf Ihrem Gerät oder iCloud Drive gespeichert.</li><li>Exporte lösen immer Sie selbst aus; nichts wird automatisch gesendet.</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Finanzen dieses Monats exportieren → eine .xlsx-Datei in „Dateien“.</li><li>Ein Album exportieren → Fotos werden an den gewählten Ort geschrieben.</li></ul>
<h3>11. Berechtigungen &amp; Datenschutz</h3>
<p><strong>Eingabe:</strong> eine Berechtigung in den Systemeinstellungen umschalten oder die App löschen.</p>
<ul><li>Gesundheit → jederzeit in der Health-App unter „Datenzugriff &amp; Geräte“ widerrufen.</li><li>Fotos → Einstellungen → Datenschutz &amp; Sicherheit → Fotos widerrufen.</li><li>Mikrofon / Spracherkennung → in Einstellungen → Datenschutz &amp; Sicherheit widerrufen.</li><li>App löschen → alle lokalen Daten werden entfernt (vorher exportieren).</li></ul>
<p><strong>Beispiele:</strong></p>
<ul><li>Fotos in den Einstellungen widerrufen → das Album-Raster kann keine neuen Fotos mehr lesen.</li><li>Die App löschen → lokale Datenbank weg; die App ist zurückgesetzt.</li></ul>`;

I18N["fr"].privacy=`<h2>Politique de confidentialité de PigPigPlan</h2>
<p class="meta">Date d'effet : septembre 2026 · Plateformes : iOS / iPadOS / macOS · Version : v1.1</p>
<div class="callout"><strong>Engagement principal.</strong> PigPigPlan est une application locale et respectueuse de la vie privée pour la gestion des finances et des données personnelles. Toutes les données que vous créez dans l'application (y compris les données de santé) sont stockées uniquement sur votre appareil, ne sont jamais téléchargées sur un serveur, et l'exportation est toujours initiée et contrôlée par vous.</div>
<h3>1. Données traitées</h3>
<p>Toutes les données sont saisies par vous ou lues après votre autorisation explicite sur votre appareil :</p>
<table><tr><th>Catégorie</th><th>Contenu</th><th>Source</th></tr>
<tr><td>Finances</td><td>Livres de compte, transactions, étiquettes, budgets, plans d'échéances</td><td>Saisie / import Excel</td></tr>
<tr><td>Santé</td><td>Fréquence cardiaque, VRC (HRV), fréquence au repos, sommeil, respiration, saturation en oxygène, température, pas, séances d'exercice, humeur, cycle menstruel, exposition au soleil</td><td>Apple Health (HealthKit), autorisation par type</td></tr>
<tr><td>Contenu</td><td>Photos de l'album simple (y compris les références à Photos système)</td><td>Votre import / capture / accès autorisé à Photos</td></tr>
<tr><td>Préférences</td><td>Langue, thème, intervalle de mise à jour santé, etc.</td><td>Générées localement</td></tr></table>
<p>Nous ne collectons PAS : nom, e-mail, téléphone, contacts, localisation, identifiant publicitaire (IDFA), etc.</p>
<h3>2. Stockage et traitement</h3>
<ul>
<li><strong>Stockage 100 % local</strong> : les données sont chiffrées (SQLCipher, AES-256) dans une base de données locale.</li>
<li><strong>IA sur l'appareil</strong> : le modèle d'IA intégré s'exécute entièrement sur votre appareil ; vos requêtes ne quittent jamais l'appareil.</li>
<li><strong>Ni serveur, ni compte, ni publicité</strong> : nous n'exploitons aucun serveur recevant vos données ; aucune inscription requise ; aucune publicité, statistique ni SDK de suivi tiers.</li>
<li><strong>Finalité</strong> : les données servent uniquement à vos fonctionnalités personnelles — tenue de comptes, analyse du stress, recherche sémantique, gestion de photos.</li>
</ul>
<h3>3. Déclaration spécifique HealthKit</h3>
<p>PigPigPlan lit les données de santé via Apple HealthKit pour l'analyse du stress (basée sur la VRC, la fréquence au repos, le sommeil, etc.) et l'affichage des tendances de santé.</p>
<ul>
<li><strong>Autorisation</strong> : avant tout accès, le système vous demande d'autoriser chaque type de données individuellement ;</li>
<li><strong>Portée</strong> : les données de santé sont traitées localement sur votre appareil, uniquement pour les fins ci-dessus ;</li>
<li><strong>Interdictions</strong> : nous ne les utilisons pas pour la publicité, ne les vendons pas et ne les divulguons à aucun tiers ;</li>
<li><strong>Révocation</strong> : désactivez l'autorisation dans l'app Santé (« Accès aux données ») ou supprimez l'application pour cesser tout accès immédiatement.</li>
</ul>
<h3>4. Exportation des données</h3>
<p>Vous gardez le contrôle total de vos données. L'exportation est toujours initiée par vous :</p>
<ul>
<li>Exportez vos propres données en Excel (.xlsx/.csv) ou fichiers, vers votre appareil ou iCloud Drive ;</li>
<li>Données exportables : registres financiers, résultats d'analyse santé, photos d'album ;</li>
<li>L'exportation sert à votre sauvegarde, migration ou analyse personnelle et n'est jamais envoyée automatiquement à un tiers ;</li>
<li>Cette application ne fournit aucun accès API à vos données à des tiers.</li>
</ul>
<h3>5. Sécurité des données</h3>
<ul><li>Base de données chiffrée localement avec SQLCipher (AES-256) ;</li><li>Données de santé traitées dans les conteneurs sécurisés du système Apple ;</li><li>Verrouillage de l'appareil et sécurité du système protègent vos données.</li></ul>
<h3>6. Conservation et suppression</h3>
<table><tr><th>Action</th><th>Résultat</th></tr>
<tr><td>Supprimer un enregistrement</td><td>Suppression immédiate de la base locale</td></tr>
<tr><td>Supprimer un livre / album</td><td>Suppression des données associées</td></tr>
<tr><td>Supprimer l'application</td><td>Suppression des données locales (exportez d'abord ; les copies de sauvegarde iCloud sont à supprimer séparément)</td></tr>
<tr><td>Désactiver l'autorisation santé</td><td>L'application cesse immédiatement de lire ce type de données</td></tr></table>
<h3>7. Vie privée des enfants</h3>
<p>L'application ne s'adresse pas aux enfants de moins de 13 ans et ne collecte pas sciemment leurs informations personnelles.</p>
<h3>8. Services tiers</h3>
<p>Aucun service tiers de publicité, de statistique ou de suivi n'est intégré. Seules dépendances : Apple HealthKit / SwiftUI / MLX (frameworks Apple fonctionnant entièrement sur l'appareil) et bibliothèques locales open source (SQLite, etc.).</p>
<h3>9. Modifications et contact</h3>
<p>Toute modification sera publiée sur cette page avec la date d'effet. Pour toute question, contactez-nous via la page « À propos » de l'application ou les coordonnées du développeur sur l'App Store.</p>
<h3>10. Fonctions nécessitant Internet</h3>
<p>La météo et la planification d'itinéraire nécessitent Internet. Seules les informations strictement nécessaires sont envoyées — coordonnées au fournisseur météo (Open-Meteo) lors des requêtes, départ/arrivée à Apple Maps pour la navigation ; aucune donnée personnelle. Toutes les autres fonctions sont entièrement hors ligne.</p>
<h3>11. Photos système et organisation des photos</h3>
<p>Lors de l'organisation de vos Photos système, l'app lit uniquement les identifiants de référence et les métadonnées (date de prise de vue, lieu, type) via PhotoKit ; elle ne copie ni ne téléverse vos photos. Les étiquettes d'analyse générées sur l'appareil (scènes, texte) sont stockées uniquement dans la base chiffrée locale et peuvent être effacées dans l'app. L'app n'utilise pas les groupes « Personnes et animaux » et ne fait pas de reconnaissance faciale.</p>`;
I18N["fr"].guide=`<h2>Guide d'utilisation de PigPigPlan</h2>
<p class="meta">Tout s'exécute sur votre appareil — aucun compte requis. Chaque section montre <strong>Entrée → Sortie</strong> et des <strong>exemples</strong> concrets.</p>
<h3>1. Premier lancement</h3>
<p><strong>Entrée :</strong> rien — ouvrez simplement l'app.</p>
<ul><li>Ouvrir l'app → une base de données locale chiffrée est créée automatiquement (sans inscription).</li><li>Vous voyez ensuite l'écran d'accueil avec les onglets : Finances, Santé, Albums, ainsi que Outils / Perso / Réglages.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Première installation sur un nouvel appareil → base initialisée, écran d'accueil affiché.</li><li>Rouvrir l'app plus tard → vos données précédentes sont déjà là.</li></ul>
<h3>2. Accueil et navigation</h3>
<p><strong>Entrée :</strong> touchez un onglet, la couronne 👑 ou ⚙️.</p>
<ul><li>Toucher un onglet → le module correspondant s'ouvre.</li><li>Toucher 👑 sur l'accueil → la page d'abonnement (Pro) s'ouvre.</li><li>Toucher ⚙️ → les Réglages s'ouvrent (langue, thème, intervalle d'actualisation, données).</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Toucher « Santé » → le tableau de bord avec vos mesures.</li><li>Toucher ⚙️ → Réglages → passer la langue en français.</li></ul>
<h3>3. Finances</h3>
<p><strong>Entrée :</strong> montant, étiquette, date, note (à saisir ou en une phrase).</p>
<ul><li>Créer un livre de comptes et ajouter une transaction → elle apparaît dans la liste ; totaux et graphiques se mettent à jour aussitôt.</li><li>Saisie vocale → toucher le micro et parler → une fiche de confirmation apparaît → « Confirmer » pour enregistrer.</li><li>Définir un budget (étiquette + période + montant) → cette étiquette affiche une barre « dépensé / budget ».</li><li>Poser une question en langage naturel → des résultats filtrés (calculés sur l'appareil).</li><li>Mode privé → les montants sont masqués en ****** par défaut ; touchez le bouton 👁️ « afficher / masquer les chiffres » en haut pour voir les montants réels (retouchez pour masquer).</li><li>Graphiques et rapports → camembert de la répartition des dépenses, histogramme par catégorie, courbe de tendance recettes/dépenses, tendance par catégorie, classement par catégorie et comparaison période à période — tout calculé sur l'appareil.</li><li>Requête vocale → touchez le micro et posez une question à voix haute (ex. « combien dépensé en restauration ce mois ») → la réponse est calculée sur l'appareil.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Dire « déjeuner 35 » → une fiche en attente « Dépense 35 · Restauration ».</li><li>Dire « budget courses 2000 mensuel » → un budget courses mensuel de 2000.</li><li>Saisir « combien dépensé en restauration ce mois » → le total restauration du mois.</li></ul>
<h3>4. Santé</h3>
<p><strong>Entrée :</strong> autorisez les types souhaités, puis ouvrez une mesure ; la saisie vocale fonctionne aussi.</p>
<ul><li>Ouvrir l'onglet Santé et autoriser des types → des cartes pour fréquence cardiaque, VRC, sommeil, exercices, température, saturation, pas, humeur, etc.</li><li>Ouvrir Stress → un indice de stress calculé à partir de VRC / fréquence au repos / sommeil, sur l'appareil.</li><li>Toucher le micro et dire une valeur → une entrée en attente à confirmer.</li><li>Requête vocale / en langage naturel → demandez « quels jours le stress était le plus élevé » → routé vers les données de stress / sommeil / exercice, calculé sur l'appareil.</li><li>Graphiques de tendance → tendance santé multi-indicateurs (stress / VRC / fréquence au repos / sommeil) et tendance de l'humeur ; exportez le rapport en Excel.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Autoriser Fréquence cardiaque &amp; Sommeil → fréquence au repos du jour et sommeil de la nuit dernière.</li><li>Dire « tension 120 80 » → une entrée de tension en attente.</li><li>Dire « poids 68 » → une entrée de poids en attente.</li><li>Dites « mal à la tête et à l’épaule aussi » → crée deux brouillons à la fois.</li><li>Dites « hier, 30 min de course, 280 kcal » → enregistre durée + calories (date = hier).</li></ul>
<h3>5. Album simple</h3>
<p><strong>Entrée :</strong> autorisez l'accès aux photos, puis choisissez des photos avec un filtre.</p>
<ul><li>Autoriser l'accès → la grille Photos système est lisible.</li><li>Filtrer par Temps / Lieu / Type / Favoris / Captures / Panorama / Rafale / Live → la grille ne montre que les photos correspondantes.</li><li>Sélectionner des photos → créer un album, réordonner, lancer un diaporama ou exporter l'album en MP4.</li><li>Choisir deux photos → les comparer côte à côte.</li><li>Seules les références et métadonnées sont lues — les photos ne sont jamais copiées ni téléversées.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Filtrer « Captures » → seules les captures sont listées.</li><li>Sélectionner 20 photos → « Exporter en MP4 » → une vidéo diaporama sur votre appareil.</li><li>Choisir 2 photos → « Comparer » → miniatures côte à côte.</li></ul>
<h3>6. Météo &amp; itinéraire (trafic)</h3>
<p><strong>Entrée :</strong> ouvrez Météo (utilise votre position) ; pour un itinéraire, indiquez départ, arrivée et mode.</p>
<ul><li>Ouvrir Météo → conditions actuelles et prévisions (données d'Open-Meteo ; vos coordonnées sont envoyées lors de la requête).</li><li>Saisir départ et arrivée + mode (voiture / marche / vélo) → l'itinéraire et l'ETA, calculés par Apple Maps.</li><li>Prévision de trafic → prédit la durée horaire d'un itinéraire sur la journée (00–23), avec un créneau de départ conseillé et le détail par heure ; exportable en Excel.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Ouvrir Météo → température du jour et prévisions à 7 jours.</li><li>Domicile → Bureau, mode « voiture » → distance, durée et itinéraire sur la carte.</li><li>Passer en mode « marche » → l'ETA est recalculée pour la marche.</li><li>Ouvrir « Prévision de trafic » → les heures de pointe sont les plus lentes ; partir plus tard → l'ETA diminue.</li></ul>
<h3>7. Recherche</h3>
<p><strong>Entrée :</strong> un mot-clé ou une question.</p>
<ul><li>Saisir un mot-clé → notes et photos correspondants sont trouvés par le sens.</li><li>Poser une question → un modèle d'IA sur l'appareil l'analyse ; les résultats sont calculés localement.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Saisir « dîner la semaine dernière » → les écritures financières correspondantes.</li><li>Saisir « photos de plage » → les photos d'album correspondantes.</li><li>Demander « combien en transport ce mois » → le total transport.</li></ul>
<h3>8. Abonnement (Pro)</h3>
<p><strong>Entrée :</strong> touchez une formule (mensuel / annuel), « Restaurer les achats » ou « Gérer l'abonnement ».</p>
<ul><li>Toucher une formule → la feuille d'achat Apple apparaît → confirmer → toutes les fonctions sont débloquées.</li><li>Toucher « Restaurer les achats » → un achat précédent est récupéré (Internet requis).</li><li>Toucher « Gérer l'abonnement » → modifier ou résilier sur la page d'Apple ; la facturation est gérée par Apple.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Toucher « Annuel » → confirmer dans la feuille Apple → Pro débloqué.</li><li>Toucher « Restaurer les achats » → un abonnement antérieur est restauré.</li><li>Toucher « Gérer l'abonnement » → la page d'abonnements d'Apple s'ouvre.</li></ul>
<h3>9. Réglages &amp; langue</h3>
<p><strong>Entrée :</strong> choisissez une langue, un thème ou une action sur les données.</p>
<ul><li>Changer langue / thème / intervalle d'actualisation → l'interface se met à jour aussitôt.</li><li>Effacer les données / gérer les autorisations / exporter → l'écran correspondant s'ouvre.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Mettre la langue en anglais → toute l'app bascule aussitôt.</li><li>Passer au thème sombre → les couleurs changent aussitôt.</li></ul>
<h3>10. Export &amp; sauvegarde</h3>
<p><strong>Entrée :</strong> choisissez ce qu'il faut exporter (finances / analyse santé / album).</p>
<ul><li>Exporter → un fichier (Excel / CSV) est produit et enregistré sur votre appareil ou iCloud Drive.</li><li>Les exports sont toujours déclenchés par vous ; rien n'est envoyé automatiquement.</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Exporter les finances du mois → un fichier .xlsx dans Fichiers.</li><li>Exporter un album → les photos écrites à l'emplacement choisi.</li></ul>
<h3>11. Autorisations &amp; confidentialité</h3>
<p><strong>Entrée :</strong> activez/désactivez une autorisation dans les Réglages système, ou supprimez l'app.</p>
<ul><li>Santé → révoquez à tout moment dans l'app Santé → « Accès aux données &amp; appareils ».</li><li>Photos → Réglages → Confidentialité et sécurité → Photos.</li><li>Micro / reconnaissance vocale → Réglages → Confidentialité et sécurité.</li><li>Supprimer l'app → toutes les données locales sont effacées (exportez avant).</li></ul>
<p><strong>Exemples :</strong></p>
<ul><li>Révoquer Photos dans Réglages → la grille d'album ne lit plus de nouvelles photos.</li><li>Supprimer l'app → base locale effacée ; l'app est réinitialisée.</li></ul>`;

I18N["es"].privacy=`<h2>Política de privacidad de PigPigPlan</h2>
<p class="meta">Fecha de entrada en vigor: septiembre de 2026 · Plataformas: iOS / iPadOS / macOS · Versión: v1.1</p>
<div class="callout"><strong>Compromiso principal.</strong> PigPigPlan es una aplicación local y centrada en la privacidad para la gestión de finanzas y datos personales. Todos los datos que creas en la aplicación (incluidos los datos de salud) se almacenan únicamente en tu dispositivo, nunca se suben a ningún servidor, y la exportación siempre la inicias y controlas tú.</div>
<h3>1. Datos tratados</h3>
<p>Todos los datos son introducidos por ti o leídos con tu autorización explícita en tu dispositivo:</p>
<table><tr><th>Categoría</th><th>Contenido</th><th>Fuente</th></tr>
<tr><td>Finanzas</td><td>Libros de cuentas, transacciones, etiquetas, presupuestos, planes a plazos</td><td>Tu entrada / importación Excel</td></tr>
<tr><td>Salud</td><td>Frecuencia cardíaca, VFC (HRV), frecuencia en reposo, sueño, respiración, saturación de oxígeno, temperatura, pasos, entrenamientos, estado de ánimo, ciclo menstrual, exposición solar</td><td>Apple Health (HealthKit), autorización por tipo</td></tr>
<tr><td>Contenido</td><td>Fotos del álbum sencillo (incluidas referencias a Fotos del sistema)</td><td>Tu importación / captura / acceso autorizado a Fotos</td></tr>
<tr><td>Preferencias</td><td>Idioma, tema, intervalo de actualización de salud, etc.</td><td>Generadas localmente</td></tr></table>
<p><strong>NO recopilamos</strong>: nombre, correo, teléfono, contactos, ubicación, identificador publicitario (IDFA), etc.</p>
<h3>2. Almacenamiento y tratamiento</h3>
<ul>
<li><strong>100 % almacenamiento local</strong>: los datos se cifran (SQLCipher, AES-256) en una base de datos local.</li>
<li><strong>IA en el dispositivo</strong>: el modelo de IA integrado se ejecuta por completo en tu dispositivo; tus consultas nunca salen de él.</li>
<li><strong>Sin servidor, sin cuenta, sin publicidad</strong>: no operamos ningún servidor que reciba tus datos; no se requiere registro; sin publicidad, estadísticas ni SDK de seguimiento de terceros.</li>
<li><strong>Finalidad</strong>: los datos sirven solo a tus funciones personales — contabilidad, análisis de estrés, búsqueda semántica, gestión de fotos.</li>
</ul>
<h3>3. Declaración específica sobre HealthKit</h3>
<p>PigPigPlan lee datos de salud a través de Apple HealthKit para el análisis de estrés (basado en VFC, frecuencia cardíaca en reposo, sueño, etc.) y la visualización de tendencias de salud.</p>
<ul>
<li><strong>Autorización</strong>: antes del acceso, el sistema te pide autorizar cada tipo de datos individualmente;</li>
